<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Décoration Discord animée</title>
<style>
/* ===== Couleurs : modifie ici ===== */
:root{
  --bg1:#0a0b1e; --bg2:#1a1250; --glow:#5b5bff;
  --panel:rgba(60,70,170,.22); --panel-border:rgba(150,160,255,.28);
  --text:#c9d0ff; --text-dim:#8e97d6; --accent:#7c5cff; --select:rgba(130,140,255,.2);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;display:grid;place-items:center;
  font-family:"Inter","gg sans","Segoe UI",system-ui,sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 65% 45%,var(--bg2),var(--bg1) 70%);background-color:var(--bg1);
}
.scene{position:relative;width:min(92vw,720px);aspect-ratio:4/3;perspective:1200px;transform-style:preserve-3d}
.scene::before{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 60% 50%,var(--glow),transparent 55%);opacity:.28;filter:blur(40px)}

/* Chaque couche = parallaxe souris ; l'enfant = flottement */
.layer{position:absolute;transform:translate3d(var(--mx,0px),var(--my,0px),0);transition:transform .25s ease-out;transform-style:preserve-3d}
.panel{
  width:100%;height:100%;border-radius:18px;background:var(--panel);
  border:1px solid var(--panel-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);
  animation:float var(--d,7s) ease-in-out infinite alternate;
}
@keyframes float{
  from{transform:rotateY(var(--ry,-20deg)) rotateX(var(--rx,6deg)) translateY(-8px) rotateZ(-.6deg)}
  to{transform:rotateY(var(--ry,-20deg)) rotateX(var(--rx,6deg)) translateY(10px) rotateZ(.6deg)}
}

/* Panneaux d'arrière-plan flous */
.back1{left:-2%;top:14%;width:34%;height:62%;--ry:25deg;--d:9s;filter:blur(5px);opacity:.7}
.back2{left:22%;top:4%;width:36%;height:80%;--ry:-12deg;--d:8s;filter:blur(2.5px);opacity:.85}
.back3{left:-6%;top:72%;width:26%;height:28%;--ry:30deg;--d:6s;filter:blur(7px);opacity:.65}
.ghost{padding:18px;display:flex;flex-direction:column;gap:12px}
.bar{height:10px;border-radius:6px;background:rgba(170,180,255,.22)}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(170,180,255,.3)}
.crown{width:38px;height:38px;color:#a99bff;margin:4px 0 0 2px}
.tile{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#6a4dff,#9b6bff);display:grid;place-items:center;margin:14px}

/* Panneau net « Salons » */
.front{left:46%;top:2%;width:50%;height:88%;--ry:-24deg;--rx:4deg;--d:7s}
.front .panel{padding:20px 18px;backdrop-filter:blur(8px);background:rgba(55,65,170,.3)}
.title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px}
.title svg{width:20px;height:20px;color:var(--text-dim)}
.ch{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;margin-bottom:4px;
  border:1px solid transparent;border-radius:10px;background:none;color:var(--text-dim);
  font:500 clamp(15px,2.6vw,19px) inherit;font-family:inherit;text-align:left;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s,box-shadow .2s;
}
.ch span{font-size:1.15em;opacity:.7;transition:opacity .2s,text-shadow .2s}
.ch:hover{background:rgba(130,140,255,.12);color:#fff}
.ch:hover span{opacity:1;text-shadow:0 0 10px var(--glow)}
.ch.sel{background:var(--select);color:#fff;border-color:rgba(170,180,255,.5);box-shadow:0 0 18px rgba(110,110,255,.35)}
.ch.sel span{opacity:1;text-shadow:0 0 10px var(--glow)}
.ch:focus-visible{outline:2px solid #fff;outline-offset:2px}

canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.layer{transition:none}}
@media (max-width:520px){.front{left:34%;width:64%}.back2{left:8%}}
</style>

<style>
/* OCKSYNE DISCORD DECORATION EMBED */
html,
body {
  background: transparent !important;
  background-color: transparent !important;
}

body {
  width: 100% !important;
  min-height: 100% !important;
  overflow: hidden !important;
}

.scene {
  width: min(98vw, 650px) !important;
  max-width: 100% !important;
}

.scene::before {
  opacity: .20 !important;
}

@media (prefers-reduced-motion: reduce) {
  .panel {
    animation: none !important;
  }
}
</style>


<style>
/* OCKSYNE_DISCORD_IFRAME_DARK_FIX_V2 */
html {
  background: #0b0d21 !important;
  background-color: #0b0d21 !important;
  color-scheme: dark;
}
body {
  background: #0b0d21 !important;
  background-color: #0b0d21 !important;
}
html, body {
  width: 100%;
  min-height: 100%;
}
</style>


<style>
/* OCKSYNE_DISCORD_SALONS_FIX_V3 */

/* Fond sombre : aucune surface blanche. */
html, body {
  width: 100% !important;
  height: 100% !important;
  min-height: 0 !important;
  margin: 0 !important;
  background: transparent !important;
  background-color: transparent !important;
  overflow: hidden !important;
  color-scheme: dark;
}

/* Toute la surface disponible est utilisée. */
body {
  display: block !important;
}

.scene {
  position: relative !important;
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  aspect-ratio: auto !important;
  overflow: visible !important;
  transform: none !important;
}

/* Le panneau principal peut contenir les cinq salons. */
.layer.front {
  position: absolute !important;
  left: 20% !important;
  top: 4% !important;
  width: 76% !important;
  height: 91% !important;
  z-index: 10 !important;
  transform: none !important;
  transition: none !important;
  pointer-events: auto !important;
}

.front > .panel {
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  height: 100% !important;
  min-height: 0 !important;
  padding: 15px 12px !important;
  overflow: hidden !important;
  border-radius: 17px !important;
  background: rgba(37,43,112,.83) !important;
  border: 1px solid rgba(145,153,255,.55) !important;
  animation: none !important;
  transform: none !important;
}

.front .title {
  flex: none !important;
  margin-bottom: 10px !important;
  font-size: 14px !important;
}

.front #list {
  display: flex !important;
  flex-direction: column !important;
  flex: 1 !important;
  min-height: 0 !important;
  gap: 4px !important;
}

.front .ch {
  display: flex !important;
  align-items: center !important;
  flex: 1 1 0 !important;
  min-height: 0 !important;
  width: 100% !important;
  padding: 5px 9px !important;
  margin: 0 !important;
  border-radius: 9px !important;
  font-family: inherit !important;
  font-size: clamp(11px,1.05vw,15px) !important;
  line-height: 1.15 !important;
  cursor: pointer !important;
  position: relative !important;
  z-index: 12 !important;
  pointer-events: auto !important;
}

.front .ch:hover {
  background: rgba(125,140,255,.27) !important;
  color: #ffffff !important;
}

.front .ch.sel,
.front .ch[aria-selected="true"] {
  background: rgba(130,145,255,.32) !important;
  border-color: rgba(170,180,255,.72) !important;
  box-shadow: 0 0 20px rgba(88,101,242,.30) !important;
  color: #ffffff !important;
}

/* Les panneaux de fond ne peuvent pas bloquer les clics. */
.layer:not(.front) {
  pointer-events: none !important;
}

canvas {
  pointer-events: none !important;
}

@media (max-width: 700px) {
  .layer.front {
    left: 13% !important;
    width: 83% !important;
    top: 2% !important;
    height: 96% !important;
  }

  .front > .panel {
    padding: 10px !important;
  }

  .front .ch {
    font-size: 12px !important;
    padding: 4px 8px !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  .front > .panel {
    animation: none !important;
  }
}
</style>

</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="scene" id="scene">
  <div class="layer" data-depth="10"><div class="panel back1"><div class="ghost">
    <svg class="crown" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18l1-11-5 4-5-7-5 7-5-4z"/></svg>
  </div></div></div>

  <div class="layer" data-depth="16"><div class="panel back2"><div class="ghost">
    <div class="avatar"></div><div class="bar" style="width:70%"></div><div class="bar" style="width:50%"></div>
    <div class="bar" style="width:80%;margin-top:14px"></div><div class="bar" style="width:40%"></div>
  </div></div></div>

  <div class="layer" data-depth="26"><div class="panel back3"><div class="tile">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="5" width="4" height="15" rx="1"/><rect x="16" y="9" width="4" height="11" rx="1"/></svg>
  </div></div></div>

  <div class="layer front" data-depth="40"><div class="panel">
    <div class="title">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6z"/><circle cx="17.5" cy="9" r="2.5" opacity=".7"/></svg>
      Salons
    </div>
    <div id="list" role="listbox" aria-label="Salons">
      <button class="ch sel" role="option" aria-selected="true"><span>#</span>général</button>
      <button class="ch" role="option" aria-selected="false"><span>#</span>annonces</button>
      <button class="ch" role="option" aria-selected="false"><span>#</span>événements</button>
      <button class="ch" role="option" aria-selected="false"><span>#</span>staff</button>
      <button class="ch" role="option" aria-selected="false"><span>#</span>entraide</button>
    </div>
  </div></div>
</div>

<script>
/* Sélection d'un salon */
const items=[...document.querySelectorAll('.ch')];
items.forEach(b=>b.addEventListener('click',()=>{
  items.forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-selected','false')});
  b.classList.add('sel');b.setAttribute('aria-selected','true');
}));

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){
  /* Parallaxe souris : chaque couche bouge selon sa profondeur */
  const layers=[...document.querySelectorAll('.layer')];
  addEventListener('pointermove',e=>{
    const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
    layers.forEach(l=>{const d=+l.dataset.depth;
      l.style.setProperty('--mx',(-x*d)+'px');l.style.setProperty('--my',(-y*d)+'px')});
  });

  /* Particules lumineuses */
  const c=document.getElementById('fx'),g=c.getContext('2d');let W,H;
  const fit=()=>{W=c.width=innerWidth;H=c.height=innerHeight};fit();addEventListener('resize',fit);
  const P=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.25+.05,a:Math.random()*.6+.2}));
  (function tick(){
    g.clearRect(0,0,W,H);
    P.forEach(p=>{p.y-=p.v;p.x+=Math.sin(p.y/60)*.2;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fillStyle=`rgba(160,170,255,${p.a})`;g.shadowBlur=8;g.shadowColor='#7c7cff';g.fill()});
    requestAnimationFrame(tick);
  })();
}
</script>
</body>
</html>
